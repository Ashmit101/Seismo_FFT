name: Build and Release Executables

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  package:
    name: Building python package
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_exists: ${{ steps.version.outputs.release_exists }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.23"

      - name: Set up Python 3.11
        run: uv python install

      # Read the version from pyproject.toml and check whether it was already released
      - name: Read project version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(uv version --short)"
          echo "Project version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::Release v$VERSION already exists. Bump the version in pyproject.toml to publish a new release."
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build project
        run: uv build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ground_motion_analyzer
          path: |
            dist/*.whl
            dist/*.tar.gz
          retention-days: 1

  build:
    name: Build — ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            artifact: ground_motion_analyzer-linux

          - os: windows-latest
            platform: windows
            artifact: ground_motion_analyzer-windows.exe

          - os: macos-latest
            platform: macos
            artifact: ground_motion_analyzer-macos

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.23"

      - name: Set up Python 3.11
        run: uv python install

      - name: Install project
        run: uv sync --locked --all-extras --dev

      - name: Build with PyInstaller
        shell: bash
        run: |
          uv run pyinstaller \
            --onefile \
            --clean \
            --name ground_motion_analyzer \
            ground_motion_analyzer/__main__.py

      - name: Stage artifact (Unix)
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          mkdir staging
          cp dist/ground_motion_analyzer staging/${{ matrix.artifact }}
          chmod +x staging/${{ matrix.artifact }}

      - name: Stage artifact (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path staging | Out-Null
          Copy-Item dist\ground_motion_analyzer.exe staging\${{ matrix.artifact }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: staging/${{ matrix.artifact }}
          retention-days: 1

  release:
    name: Publish GitHub Release
    needs: [package, build]
    # Only publish when pyproject.toml has a version that hasn't been released yet
    if: needs.package.outputs.release_exists == 'false'
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true  # puts all files directly in release-assets/
          # To attach only the executables (no wheel/sdist), uncomment:
          # pattern: ground_motion_analyzer-*

      # ── 2. Quick sanity check ────────────────────────────────────────────
      - name: List release assets
        run: ls -lh release-assets/

      # ── 3. Create the GitHub Release and attach the executables ──────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ needs.package.outputs.version }}"
          name: "v${{ needs.package.outputs.version }}"
          target_commitish: ${{ github.sha }}
          body: |
            ## Ground Motion Analyzer v${{ needs.package.outputs.version }}

            | | |
            |---|---|
            | **Version** | `${{ needs.package.outputs.version }}` |
            | **Commit** | `${{ github.sha }}` |
            | **Branch** | `${{ github.ref_name }}` |
            | **Workflow run** | [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |

            ---

            ### Downloads

            | Platform | File |
            |----------|------|
            | Linux  | `ground_motion_analyzer-linux` |
            | Windows | `ground_motion_analyzer-windows.exe` |
            | macOS  | `ground_motion_analyzer-macos` |
            | Python package | `.whl` / `.tar.gz` (install with `pip install`) |

            ---

            ### First-run notes

            **Linux**
            ```bash
            chmod +x ground_motion_analyzer-linux
            ./ground_motion_analyzer-linux
            ```

            **macOS** — Gatekeeper will block an unsigned binary on first run:
            ```bash
            chmod +x ground_motion_analyzer-macos
            xattr -d com.apple.quarantine ground_motion_analyzer-macos
            ./ground_motion_analyzer-macos
            ```

            **Windows** — SmartScreen may warn about an unsigned `.exe`.
            Click **More info → Run anyway** to proceed.
          files: release-assets/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}